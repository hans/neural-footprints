[project]
name = "neural-footprints"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pybullet",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "snakemake>=9",
    "pyyaml",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that boot PyBullet (deselect with -m 'not slow')",
]
addopts = "-m 'not slow'"

