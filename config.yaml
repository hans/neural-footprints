n_scenes: 2000
n_objects: 1
image_size: 64
n_neurons: 500
n_timesteps: 120
noise_level: 0.3
random_seed: 43

# Generative scene parameters
# linvel_x is sampled uniformly from [-linvel_x_max, +linvel_x_max].
# Experiment B (specs/scene_generation_review.md): tightened from 8.0 to 3.0
# so the object stays on-screen across the longer 500 ms window needed for
# x_accel inference.
linvel_x_max: 3.0
rsa_subsample: 500
render_pca_dim: 500
behavioral_pca_dim: 50
behavioral_objective: "next_frame_pixels"

# Camera
# Wider FOV (90°) keeps the moving object on-screen for more frames and
# substantially improves the PP inverse model's recovery of pos_y / pos_z.
camera_fov: 90

# Predictive processing
# Inverse model takes three frames at t={0, pp_early_frame, pp_late_frame}.
# Three evenly-spaced frames let the model disentangle initial velocity
# from the per-scene x_accel injection.
#
# Experiment B (specs/scene_generation_review.md): n_timesteps=120 with frames
# at {0, 40, 80} extends the late-frame window to ~333 ms, paired with the
# tightened linvel_x range so the object stays in-frame across the window.
pp_hidden_dim: 256
pp_pixel_pca_dim: 50
pp_early_frame: 40
pp_late_frame: 80
pp_dropout_rate: 0.05

# Neural generation source: cognitive PP model
# neural_input = [render_bytes | InverseModel.<pp_neural_layer> | inferred_physics]
# pp_neural_layer: which hidden layer to tap (h1, h2, h3)
pp_neural_layer: "h2"

# Inverse-model backbone selector:
#   'mlp'         — pixel-PCA → MLP (legacy default; uses pp_pixel_pca_dim/pp_hidden_dim)
#   'softmax_cnn' — raw 3-frame stack → SpatialSoftmaxV2 (uses pp_softmax: block)
# Code defaults to 'mlp' if the key is missing (back-compat for older branches).
pp_inverse_backbone: "softmax_cnn"

# SpatialSoftmaxV2 knobs — consulted only when pp_inverse_backbone == 'softmax_cnn'.
# These reproduce the v2_128_temp_mlp config from the sweep
# (mean valid-dim R² 0.828, ~21% of gridpool's params).
pp_softmax:
  n_filters: 128
  learned_temp: true
  temp_per_channel: true
  include_variance: false
  hidden_dim: 256
  head_depth: 3
  # Dropout in the head's hidden Linears. 0.0 reproduces the validated sweep
  # (mean valid-dim R² ≈ 0.83); 0.05 enables MC-dropout uncertainty in
  # predict_stochastic but costs ~0.2 R² on this dataset.
  dropout_rate: 0.0
  n_epochs: 200
  patience: 30
  min_epochs: 60
  lr: 1.0e-3
  batch_size: 64
